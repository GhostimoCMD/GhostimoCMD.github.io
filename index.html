<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receptenboek</title>
<style>
  :root { --bg:#fff; --ink:#111113; --muted:#8a8a90; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0c; --ink:#f3f3f5; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:64px 20px; }
  h1 { font-size:32px; letter-spacing:-.6px; margin:0 0 8px; }
  p { color:var(--muted); margin:0; }
</style>
</head>
<body>
<main>
  <h1>Receptenboek</h1>
  <p>Hier komen gedeelde recepten uit de app Receptenboek terecht.</p>
</main>
</body>
</html>
