<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Recept · Receptenboek</title>
<style>
  /* Zelfde stijl als de app: monochroom, veel lucht. */
  :root {
    --bg:#ffffff; --soft:#f4f4f5; --ink:#111113; --muted:#8a8a90; --line:#ececee; --accent:#111113; --accent-ink:#ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0b0c; --soft:#1b1b1e; --ink:#f3f3f5; --muted:#8a8a90; --line:#222225; --accent:#f3f3f5; --accent-ink:#0b0b0c; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:40px max(20px, env(safe-area-inset-left)) 64px; display:flex; flex-direction:column; gap:28px; }
  .brand { font-size:13px; font-weight:500; color:var(--muted); }
  h1 { font-size:30px; line-height:1.2; letter-spacing:-.4px; margin:6px 0 4px; text-wrap:balance; }
  .meta { color:var(--muted); margin:0; }
  .open { display:flex; align-items:center; justify-content:center; height:52px; border-radius:14px; background:var(--accent); color:var(--accent-ink); font-weight:600; text-decoration:none; }
  .open:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  .hint { color:var(--muted); font-size:14px; margin:8px 0 0; text-align:center; }
  h2 { font-size:13px; font-weight:500; color:var(--muted); margin:0 0 8px; }
  ul { list-style:none; margin:0; padding:0; }
  li.ing { display:flex; justify-content:space-between; gap:12px; padding:13px 0; border-top:1px solid var(--line); }
  li.ing:first-child { border-top:0; }
  .qty { color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  ol { margin:0; padding:0; list-style:none; counter-reset:s; display:flex; flex-direction:column; gap:14px; }
  ol li { counter-increment:s; display:flex; gap:14px; }
  ol li::before { content:counter(s); color:var(--muted); font-weight:600; min-width:18px; font-variant-numeric:tabular-nums; }
  .notes { white-space:pre-wrap; margin:0; }
  .error { background:var(--soft); border-radius:14px; padding:20px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div>
    <div class="brand">Receptenboek</div>
    <h1 id="title">Recept</h1>
    <p class="meta" id="meta"></p>
  </div>

  <div id="openBox" hidden>
    <a class="open" id="open" href="#">Toevoegen aan Receptenboek</a>
    <p class="hint">Opent de app en voegt het recept toe.</p>
  </div>

  <section id="ingSec" hidden><h2>Ingrediënten</h2><ul id="ing"></ul></section>
  <section id="stepSec" hidden><h2>Bereiding</h2><ol id="steps"></ol></section>
  <section id="noteSec" hidden><h2>Notities</h2><p class="notes" id="notes"></p></section>

  <div class="error" id="error" hidden>
    <strong>Dit recept kon niet geopend worden.</strong>
    <p class="meta">De link is onvolledig of beschadigd. Vraag de afzender om hem opnieuw te sturen.</p>
  </div>
</main>

<script>
// Het recept zit in de link na "#RB1." en wordt alleen hier in je browser gelezen.
// Dat deel van een link wordt nooit naar een server gestuurd.
(function () {
  var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  var COUNT = { '': 1, stuk: 1, teen: 1, blik: 1, pak: 1, bos: 1, takje: 1 };

  function decode(code) {
    var bytes = [], buf = 0, bits = 0;
    for (var i = 0; i < code.length; i++) {
      var v = B64.indexOf(code[i]);
      if (v < 0) throw new Error('ongeldig');
      buf = ((buf << 6) | v) & 0xffffff; bits += 6;
      if (bits >= 8) { bits -= 8; bytes.push((buf >> bits) & 255); }
    }
    return JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(new Uint8Array(bytes)));
  }

  function str(v, max) { return typeof v === 'string' ? v.slice(0, max) : ''; }

  function amount(q, u) {
    if (!(q > 0)) return '';
    if (COUNT[u]) {
      var r = Math.max(0.25, Math.round(q * 4) / 4), w = Math.floor(r);
      return (w || '') + ({ 0: '', 0.25: '¼', 0.5: '½', 0.75: '¾' }[r - w] || '');
    }
    if (q >= 100) return String(Math.round(q / 5) * 5);
    if (q >= 10) return String(Math.round(q));
    return String(Math.round(q * 10) / 10).replace('.', ',');
  }

  function unit(u, q) {
    var plural = q > 1;
    return { stuk: '', teen: plural ? 'teentjes' : 'teentje', snuifje: plural ? 'snuifjes' : 'snuifje',
      takje: plural ? 'takjes' : 'takje', blik: plural ? 'blikken' : 'blik', pak: plural ? 'pakken' : 'pak' }[u] ?? u;
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // Uitnodiging voor een gedeelde winkellijst.
  var lijst = location.hash.match(/^#LIJST\.([A-Za-z0-9_-]{24,64})$/);
  if (lijst) {
    document.title = 'Gedeelde winkellijst · Receptenboek';
    document.getElementById('title').textContent = 'Gedeelde winkellijst';
    document.getElementById('meta').textContent = 'Je bent uitgenodigd om samen één winkellijst bij te houden in Receptenboek.';
    var isAndroid = /Android/i.test(navigator.userAgent);
    var a = document.getElementById('open');
    a.textContent = 'Openen in Receptenboek';
    a.href = isAndroid
      ? 'intent://lijst?lijst=' + lijst[1] + '#Intent;scheme=receptenboek;package=be.receptenboek.app;end'
      : 'receptenboek://lijst?lijst=' + lijst[1];
    document.querySelector('#openBox .hint').textContent = 'Je hebt de app Receptenboek nodig.';
    document.getElementById('openBox').hidden = false;
    return;
  }

  var m = location.hash.match(/^#RB1\.([A-Za-z0-9_-]+)$/);
  var d = null;
  try { d = m ? decode(m[1]) : null; } catch (e) { d = null; }
  var naam = d && str(d.n, 120).trim();
  if (!naam) { document.getElementById('error').hidden = false; document.getElementById('title').textContent = 'Recept niet gevonden'; return; }

  var p = Math.min(99, Math.max(1, Math.round(Number(d.p)) || 4));
  document.title = naam + ' · Receptenboek';
  document.getElementById('title').textContent = naam;
  document.getElementById('meta').textContent = p + (p === 1 ? ' persoon' : ' personen') + (str(d.c, 60) ? ' · ' + str(d.c, 60) : '');

  // Knop die de app opent. Op Android via een intent-link; elders via het eigen schema.
  var code = m[1];
  var android = /Android/i.test(navigator.userAgent);
  document.getElementById('open').href = android
    ? 'intent://import?rb1=' + code + '#Intent;scheme=receptenboek;package=be.receptenboek.app;end'
    : 'receptenboek://import?rb1=' + code;
  document.getElementById('openBox').hidden = false;

  var ing = Array.isArray(d.i) ? d.i.slice(0, 200) : [];
  var ul = document.getElementById('ing');
  ing.forEach(function (x) {
    if (!Array.isArray(x) || typeof x[2] !== 'string' || !x[2].trim()) return;
    var q = Number(x[0]), u = str(x[1], 20), a = amount(q, u);
    var li = el('li', 'ing');
    li.appendChild(el('span', null, str(x[2], 120)));
    li.appendChild(el('span', 'qty', a ? a + (unit(u, q) ? ' ' + unit(u, q) : '') : ''));
    ul.appendChild(li);
  });
  document.getElementById('ingSec').hidden = !ul.children.length;

  var steps = str(d.s, 20000).split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  var ol = document.getElementById('steps');
  steps.forEach(function (s) { ol.appendChild(el('li', null, s)); });
  document.getElementById('stepSec').hidden = !steps.length;

  var notes = str(d.o, 5000).trim();
  document.getElementById('notes').textContent = notes;
  document.getElementById('noteSec').hidden = !notes;
})();
</script>
</body>
</html>
